spring.application.name=tarefas 
spring.datasource.url=jdbc:h2:mem:tarefasdb


spring.datasource.username=sa
spring.datasource.password=

# Atualiza o esquema do banco automaticamente
spring.jpa.hibernate.ddl-auto=update

# Mostra os comandos SQL no console (útil para aprender)
spring.jpa.show-sql=true

# Habilita a interface web do H2 para visualizarmos as tabelas
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console



